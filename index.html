<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>চাকরির সার্কাস — বস vs কর্মচারী</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@600;800&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<style>

:root{
  --ink:#14142B;
  --bg:#3340F2;
  --paper:#FFFFFF;
  --yellow:#FFD23F;
  --pink:#FF5C8A;
  --mint:#3DDC97;
  --focus:#3340F2;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bg:#1A1F7A; } }
:root[data-theme="dark"]{ --bg:#1A1F7A; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
[hidden]{ display:none !important; }
body{
  margin:0; background:var(--bg); color:#fff;
  font-family:'Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif;
  font-size:17px; line-height:1.6;
  padding:20px 14px 40px;
}
.display{ font-family:'Baloo Da 2','Hind Siliguri',system-ui,sans-serif; font-weight:800; }

/* ---------- header ---------- */
.top{ max-width:980px; margin:0 auto 22px; text-align:center; }
.top h1{
  margin:0; font-family:'Baloo Da 2','Hind Siliguri',sans-serif; font-weight:800;
  font-size:clamp(2.6rem,10vw,5rem); line-height:1.15; color:var(--yellow);
  -webkit-text-stroke:7px var(--ink); paint-order:stroke fill;
  text-shadow:5px 5px 0 var(--ink); transform:rotate(-2deg); display:inline-block;
}
.top p{ margin:10px auto 0; max-width:34em; font-size:clamp(15px,4vw,18px); }

/* ---------- live stage ---------- */
.stage{
  position:relative; max-width:980px; margin:0 auto;
  display:grid; grid-template-columns:1fr 1fr;
  background-color:var(--yellow);
  background-image:radial-gradient(rgba(20,20,43,.16) 1.7px,transparent 1.8px);
  background-size:14px 14px;
  border:4px solid var(--ink); border-radius:28px; box-shadow:8px 8px 0 var(--ink);
  padding:16px 8px 14px; color:var(--ink); overflow:hidden;
}
.actor{ display:flex; flex-direction:column; align-items:center; padding:0 6px; min-width:0; }
.bubble{
  position:relative; background:#fff; border:3px solid var(--ink); border-radius:18px;
  padding:8px 12px; width:100%; max-width:300px; min-height:4.6em; margin-bottom:16px;
  display:flex; align-items:center; justify-content:center; text-align:center;
  font-weight:600; font-size:clamp(12.5px,3.5vw,16px); line-height:1.45;
}
.bubble::after{
  content:""; position:absolute; left:50%; bottom:-12px; width:18px; height:18px; background:#fff;
  border-right:3px solid var(--ink); border-bottom:3px solid var(--ink);
  transform:translateX(-50%) rotate(45deg);
}
.bpop{ animation:bpop .32s ease-out; }
@keyframes bpop{ 0%{ transform:scale(.88) rotate(-2deg); } 60%{ transform:scale(1.04); } 100%{ transform:scale(1); } }
.fig{ width:min(100%,240px); }
.nametag{
  margin-top:8px; background:var(--ink); color:#fff; border-radius:12px; padding:0 14px;
  font-family:'Baloo Da 2','Hind Siliguri',sans-serif; font-weight:800; font-size:clamp(15px,4vw,19px);
  max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.vs{
  position:absolute; left:50%; top:58%; transform:translate(-50%,-50%) rotate(-8deg);
  width:56px; height:56px; border-radius:50%; background:var(--pink); color:#fff;
  border:3px solid var(--ink); box-shadow:3px 3px 0 var(--ink);
  display:grid; place-items:center; font-family:'Baloo Da 2',sans-serif; font-weight:800; font-size:20px;
  -webkit-text-stroke:1px var(--ink); paint-order:stroke fill; z-index:2;
}

/* ---------- builder ---------- */
.builder{ max-width:980px; margin:30px auto 0; display:grid; gap:22px; }
@media (min-width:900px){ .builder{ grid-template-columns:1fr 1fr; align-items:start; } }
.panel{
  background:var(--paper); color:var(--ink); border:4px solid var(--ink); border-radius:22px;
  box-shadow:6px 6px 0 var(--ink); overflow:hidden;
}
.panel h2{
  margin:0; padding:8px 18px; font-family:'Baloo Da 2','Hind Siliguri',sans-serif; font-weight:800;
  font-size:1.55rem; border-bottom:4px solid var(--ink);
}
.panel.emp h2{ background:var(--mint); }
.panel.boss h2{ background:var(--pink); }
.panel .body{ padding:16px 18px 20px; display:grid; gap:18px; }
.qlabel{ font-weight:600; margin-bottom:8px; }
.field input[type=text]{
  width:100%; font:inherit; font-size:16px; color:var(--ink); background:#fff;
  border:3px solid var(--ink); border-radius:12px; padding:8px 14px;
}
.field input[type=text]:focus-visible{ outline:3px solid var(--focus); outline-offset:2px; }
.chips{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{ position:relative; }
.chip input{ position:absolute; inset:0; width:100%; height:100%; margin:0; opacity:0; cursor:pointer; }
.chip span{
  display:inline-block; padding:5px 14px; background:#fff; color:var(--ink);
  border:3px solid var(--ink); border-radius:999px; font-size:15px; line-height:1.5;
  transition:transform .12s, box-shadow .12s, background .12s;
}
.chip input:checked + span{ background:var(--yellow); box-shadow:3px 3px 0 var(--ink); transform:translate(-2px,-2px); font-weight:600; }
.chip input:focus-visible + span{ outline:3px solid var(--focus); outline-offset:3px; }

/* ---------- buttons ---------- */
.cta{ max-width:980px; margin:30px auto 0; display:flex; flex-wrap:wrap; gap:14px; justify-content:center; }
.btn{
  font-family:'Baloo Da 2','Hind Siliguri',sans-serif; font-weight:800; font-size:1.25rem; line-height:1.4;
  color:var(--ink); background:#fff; border:4px solid var(--ink); border-radius:18px; padding:8px 24px;
  box-shadow:5px 5px 0 var(--ink); cursor:pointer; transition:transform .1s, box-shadow .1s;
}
.btn:hover{ transform:translate(-1px,-1px); box-shadow:6px 6px 0 var(--ink); }
.btn:active{ transform:translate(5px,5px); box-shadow:0 0 0 var(--ink); }
.btn:focus-visible{ outline:4px solid var(--yellow); outline-offset:4px; }
.btn.main{ background:var(--pink); color:#fff; font-size:1.55rem; padding:10px 30px; -webkit-text-stroke:0; text-shadow:2px 2px 0 var(--ink); }
.btn[disabled]{ opacity:.85; cursor:wait; }

/* ---------- result ---------- */
.result{ max-width:980px; margin:46px auto 0; }
.result .big{
  margin:0; text-align:center; font-family:'Baloo Da 2','Hind Siliguri',sans-serif; font-weight:800;
  font-size:clamp(2rem,7vw,3.2rem); color:var(--yellow);
  -webkit-text-stroke:6px var(--ink); paint-order:stroke fill; text-shadow:4px 4px 0 var(--ink);
}
.cards{ display:grid; gap:24px; margin-top:22px; }
@media (min-width:760px){ .cards{ grid-template-columns:1fr 1fr; } }
.card{
  position:relative; background:#fff; color:var(--ink); border:4px solid var(--ink); border-radius:24px;
  box-shadow:8px 8px 0 var(--ink); overflow:hidden;
}
.photo{
  position:relative; padding:18px 20px 0; border-bottom:4px solid var(--ink);
  background-image:radial-gradient(rgba(20,20,43,.14) 1.6px,transparent 1.7px); background-size:13px 13px;
}
.photo.e{ background-color:#B7F2D6; }
.photo.b{ background-color:#FFC4D6; }
.photo .fig{ width:min(66%,210px); margin:0 auto; }
.stamp{
  position:absolute; top:16px; right:14px; z-index:2; padding:0 12px;
  font-family:'Baloo Da 2',sans-serif; font-weight:800; font-size:1.2rem; color:#D8174B;
  border:4px solid #D8174B; border-radius:10px; background:rgba(255,255,255,.85);
  transform:rotate(12deg);
}
.cbody{ padding:16px 20px 22px; }
.cbody h3{ margin:0; font-family:'Baloo Da 2','Hind Siliguri',sans-serif; font-weight:800; font-size:2rem; line-height:1.25; }
.jobtitle{ margin:2px 0 10px; font-weight:600; font-size:1.05rem; }
.badges{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
.badge{ border:3px solid var(--ink); border-radius:10px; padding:0 10px; font-size:14px; font-weight:500; background:var(--yellow); }
.stats{ display:grid; gap:9px; margin-bottom:16px; }
.stat-top{ display:flex; justify-content:space-between; font-size:14.5px; font-weight:500; }
.track{ height:16px; border:3px solid var(--ink); border-radius:999px; background:#fff; overflow:hidden; }
.fill{ height:100%; width:0; transition:width 1s cubic-bezier(.2,.8,.2,1); border-right:3px solid var(--ink); }
.fill.zero{ border-right:0; }
.said{ margin:0; display:grid; gap:8px; }
.said div{ border:3px solid var(--ink); border-radius:12px; padding:6px 12px; }
.said div.t{ background:#DFF8EC; }
.said div.r{ background:#FFE0E7; }
.said dt{ font-weight:600; font-size:14px; }
.said dd{ margin:0; font-size:15.5px; }
.quote{ margin:14px 0 0; padding:8px 14px; background:var(--ink); color:#fff; border-radius:14px; font-weight:500; }

.reveal{ animation:reveal .7s cubic-bezier(.2,.9,.3,1.2) both; }
.reveal.r2{ animation-delay:.25s; }
@keyframes reveal{ from{ opacity:0; transform:translateY(46px) rotate(-3deg) scale(.94); } to{ opacity:1; transform:none; } }
.stamp{ animation:stamp .5s .9s cubic-bezier(.2,.8,.3,1) both; }
@keyframes stamp{ 0%{ opacity:0; transform:rotate(12deg) scale(2.6); } 70%{ opacity:1; transform:rotate(12deg) scale(.92); } 100%{ opacity:1; transform:rotate(12deg) scale(1); } }

.match{
  margin-top:28px; background:var(--yellow); color:var(--ink); border:4px solid var(--ink);
  border-radius:24px; box-shadow:8px 8px 0 var(--ink); padding:20px 22px; text-align:center;
}
.match .pct{ font-family:'Baloo Da 2',sans-serif; font-weight:800; font-size:clamp(3rem,12vw,4.6rem); line-height:1.1; }
.match .lbl{ font-weight:600; }
.match .mtrack{ height:26px; border:4px solid var(--ink); border-radius:999px; background:#fff; margin:12px auto; max-width:520px; overflow:hidden; }
.match .mfill{ height:100%; width:0; background:var(--pink); border-right:4px solid var(--ink); transition:width 1.4s cubic-bezier(.2,.8,.2,1) .4s; }
.match .verdict{ font-size:1.15rem; font-weight:600; }
.actions{ display:flex; flex-wrap:wrap; gap:14px; justify-content:center; margin-top:26px; }

.foot{ max-width:980px; margin:44px auto 0; text-align:center; font-size:14px; opacity:.85; }
.toast{
  position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,30px);
  background:var(--ink); color:#fff; border:3px solid #fff; border-radius:14px; padding:6px 18px; font-weight:600;
  opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:20;
}
.toast.on{ opacity:1; transform:translate(-50%,0); }

/* ---------- characters ---------- */
.char{ display:block; width:100%; height:auto; overflow:visible; }
.char .fx{ transform-box:fill-box; transform-origin:center; }
.char .head{ transform-box:view-box; transform-origin:100px 150px; }
.char .all{ transform-box:view-box; transform-origin:100px 260px; }

.m-sleepy .head{ animation:nod 3.4s ease-in-out infinite; }
@keyframes nod{ 0%,35%,100%{ transform:rotate(0); } 55%,80%{ transform:rotate(10deg) translateY(5px); } }
.zz{ opacity:0; animation:zz 3s ease-out infinite; }
.z1{ animation-delay:1s; } .z2{ animation-delay:2s; }
@keyframes zz{ 0%{ opacity:0; transform:translate(0,12px) scale(.6); } 25%{ opacity:1; } 100%{ opacity:0; transform:translate(16px,-34px) scale(1.2); } }
.drool{ transform-box:fill-box; transform-origin:50% 0; animation:drool 2.4s ease-in-out infinite; }
@keyframes drool{ 0%,100%{ transform:scaleY(.5); } 50%{ transform:scaleY(1.2); } }
.steam{ opacity:0; animation:steam 2.6s ease-out infinite; }
.st1{ animation-delay:.85s; } .st2{ animation-delay:1.7s; }
@keyframes steam{ 0%{ opacity:0; transform:translateY(6px); } 30%{ opacity:1; } 100%{ opacity:0; transform:translateY(-20px); } }
.m-chai .all{ animation:bounce 1.1s ease-in-out infinite; }
@keyframes bounce{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
.m-fake .head{ animation:type .3s steps(1) infinite alternate; }
@keyframes type{ from{ transform:translateY(0); } to{ transform:translateY(2px); } }
.sweat{ animation:sweat 1.7s ease-in infinite; }
@keyframes sweat{ 0%{ opacity:0; transform:translateY(-8px); } 30%{ opacity:1; } 100%{ opacity:0; transform:translateY(18px); } }
.pop{ animation:pop 1.6s ease-in-out infinite; }
@keyframes pop{ 0%,100%{ transform:scale(1) rotate(-3deg); } 50%{ transform:scale(1.1) rotate(3deg); } }
.m-zombie .all{ animation:shake .45s linear infinite; }
@keyframes shake{ 0%,100%{ transform:translate(0,0) rotate(0); } 25%{ transform:translate(-1.5px,1px) rotate(-.6deg); } 75%{ transform:translate(1.5px,-1px) rotate(.6deg); } }
.floaty{ animation:floaty 2.2s ease-in-out infinite; }
@keyframes floaty{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-6px); } }

.m-asap .head{ animation:rage .2s linear infinite; }
@keyframes rage{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(1.6px); } }
.puff{ opacity:0; animation:puff 1.4s ease-out infinite; }
.p1{ animation-delay:.35s; } .p2{ animation-delay:.7s; } .p3{ animation-delay:1.05s; }
@keyframes puff{ 0%{ opacity:0; transform:translateY(4px) scale(.4); } 25%{ opacity:1; } 100%{ opacity:0; transform:translateY(-34px) scale(1.5); } }
.shout{ animation:shout .3s ease-in-out infinite alternate; }
@keyframes shout{ from{ transform:scale(.92); } to{ transform:scale(1.08); } }
.point{ transform-box:view-box; transform-origin:150px 178px; animation:point .5s ease-in-out infinite alternate; }
@keyframes point{ from{ transform:rotate(-4deg); } to{ transform:rotate(5deg); } }

.m-meeting .head{ animation:bob .7s ease-in-out infinite alternate; }
@keyframes bob{ from{ transform:rotate(-2deg); } to{ transform:rotate(2deg) translateY(2px); } }
.talk{ animation:talk .45s ease-in-out infinite; }
@keyframes talk{ 0%,100%{ transform:scaleY(.35); } 50%{ transform:scaleY(1.1); } }
.tick{ animation:wig 1s ease-in-out infinite; }
@keyframes wig{ 0%,100%{ transform:rotate(-8deg); } 50%{ transform:rotate(8deg); } }

.m-midnight .head{ animation:creep 4s ease-in-out infinite; }
@keyframes creep{ 0%,100%{ transform:rotate(-3deg); } 50%{ transform:rotate(4deg); } }
.glow{ animation:glow 1.2s ease-in-out infinite; }
@keyframes glow{ 0%,100%{ opacity:.25; transform:scale(.9); } 50%{ opacity:.6; transform:scale(1.2); } }
.ting{ opacity:0; animation:ting 1.8s ease-out infinite; }
@keyframes ting{ 0%{ opacity:0; transform:scale(.3); } 20%{ opacity:1; transform:scale(1.1); } 60%{ opacity:1; transform:scale(1); } 100%{ opacity:0; transform:scale(1) translateY(-8px); } }

.m-credit .head{ animation:smug 3s ease-in-out infinite; }
@keyframes smug{ 0%,100%{ transform:rotate(0); } 50%{ transform:rotate(-5deg) translateY(-2px); } }
.twinkle{ animation:twinkle 1.4s ease-in-out infinite; }
.t1{ animation-delay:.5s; } .t2{ animation-delay:.9s; }
@keyframes twinkle{ 0%,100%{ transform:scale(.2) rotate(0); opacity:.3; } 50%{ transform:scale(1) rotate(45deg); opacity:1; } }

.m-friendly .head{ animation:sway 1.6s ease-in-out infinite alternate; }
@keyframes sway{ from{ transform:rotate(-5deg); } to{ transform:rotate(5deg); } }
.beat{ animation:beat .7s ease-in-out infinite; }
@keyframes beat{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.25); } }
.hf{ opacity:0; animation:hf 2.4s ease-out infinite; }
.hf.h1{ animation-delay:.8s; } .hf.h2{ animation-delay:1.6s; }
@keyframes hf{ 0%{ opacity:0; transform:translateY(8px) scale(.6); } 25%{ opacity:1; } 100%{ opacity:0; transform:translateY(-40px) scale(1.1); } }
.wave{ transform-box:view-box; transform-origin:150px 178px; animation:wave .55s ease-in-out infinite alternate; }
@keyframes wave{ from{ transform:rotate(-8deg); } to{ transform:rotate(10deg); } }

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{ animation:none !important; transition:none !important; }
}

/* ---------- v2 additions ---------- */
.kw{ border-top:3px dashed var(--ink); padding-top:14px; }
.kwrow{ display:flex; gap:8px; }
.kwrow input{ flex:1; min-width:0; font:inherit; font-size:16px; color:var(--ink); background:#fff; border:3px solid var(--ink); border-radius:12px; padding:8px 14px; }
.kwrow input:focus-visible{ outline:3px solid var(--focus); outline-offset:2px; }
.kwadd{ font:inherit; font-weight:600; color:var(--ink); background:var(--yellow); border:3px solid var(--ink); border-radius:12px; padding:0 16px; cursor:pointer; box-shadow:3px 3px 0 var(--ink); }
.kwadd:active{ transform:translate(3px,3px); box-shadow:none; }
.kwadd:focus-visible,.sg:focus-visible,.tagx:focus-visible{ outline:3px solid var(--focus); outline-offset:2px; }
.tags{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
.tags:empty{ display:none; }
.tag{ display:inline-flex; align-items:center; gap:6px; border:3px solid var(--ink); border-radius:999px; padding:0 6px 0 12px; font-size:15px; font-weight:500; }
.tag.ok{ background:#BDF3DA; }
.tag.cu{ background:#FFE58A; border-style:dashed; }
.tagx{ font:inherit; font-weight:600; line-height:1; width:24px; height:24px; border-radius:50%; border:2px solid var(--ink); background:#fff; color:var(--ink); cursor:pointer; padding:0; }
.sgs{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; align-items:center; }
.sgs small{ font-size:13.5px; opacity:.75; }
.sg{ font:inherit; font-size:13.5px; color:var(--ink); background:#fff; border:2px solid var(--ink); border-radius:999px; padding:0 10px; cursor:pointer; }
.sg:hover{ background:var(--yellow); }
.hint{ margin:10px 0 0; font-size:14px; line-height:1.55; opacity:.85; }

.topbar{ max-width:980px; margin:0 auto 18px; display:flex; flex-wrap:wrap; gap:12px; justify-content:center; }
.btn.small{ font-size:1.05rem; padding:4px 18px; border-width:3px; box-shadow:4px 4px 0 var(--ink); }
.export{ margin-top:30px; }
.posterwrap{ display:grid; justify-items:center; gap:8px; }
.posterwrap img{ width:100%; max-width:480px; height:auto; aspect-ratio:4/5; border:4px solid var(--ink); border-radius:14px; box-shadow:6px 6px 0 var(--ink); background:#E9E9F7; }
.pstatus{ font-size:14px; min-height:1.4em; }
.export .actions{ margin-top:6px; }
.anal{ display:grid; gap:18px; }
@media (min-width:760px){ .anal{ grid-template-columns:1fr 1fr; } }
.anal h3{ margin:0 0 6px; font-family:'Baloo Da 2','Hind Siliguri',sans-serif; font-size:1.25rem; }
.anal ul{ margin:0; padding-left:20px; display:grid; gap:4px; font-size:15px; }
.anal .fin{ margin:8px 0 0; font-weight:600; font-size:15px; }
.fill.cus{ border-right-color:var(--ink); }
</style>
</head>
<body>

<header class="top">
  <h1>চাকরির সার্কাস</h1>
  <p>বস আর কর্মচারীর কার্টুন বানাও। নিজের মতো করে ফিচার লেখো, আমি বিশ্লেষণ করে ক্যারেক্টার আঁকব। সবার জন্য ফ্রি, লগইন লাগবে না।</p>
</header>

<div id="viewBuild">
  <section class="stage" aria-label="লাইভ প্রিভিউ">
    <div class="actor">
      <div class="bubble" id="empBubble"></div>
      <div class="fig" id="empFig"></div>
      <div class="nametag" id="empTag"></div>
    </div>
    <div class="vs" aria-hidden="true">VS</div>
    <div class="actor">
      <div class="bubble" id="bossBubble"></div>
      <div class="fig" id="bossFig"></div>
      <div class="nametag" id="bossTag"></div>
    </div>
  </section>

  <main class="builder">
    <section class="panel emp" aria-labelledby="empH">
      <h2 id="empH">👷 কর্মচারী বানাও</h2>
      <div class="body" id="empForm"></div>
    </section>
    <section class="panel boss" aria-labelledby="bossH">
      <h2 id="bossH">🤵 বস বানাও</h2>
      <div class="body" id="bossForm"></div>
    </section>
  </main>

  <div class="cta">
    <button class="btn main" id="goBtn" type="button">🎬 প্রোফাইল রেডি করো!</button>
    <button class="btn" id="randBtn" type="button">🎲 এলোমেলো বেছে দাও</button>
  </div>
</div>

<div id="viewResult" hidden>
  <div class="topbar">
    <button class="btn small" id="editBtn" type="button">✏️ এডিট করো</button>
    <button class="btn small" id="newBtn" type="button">🆕 নতুন বানাও</button>
  </div>

function describe(kind,c,id){
  if(c==='acc') return ACC_DESC[id]||id;
  const it=byId(LISTS[kind][c],id); return it?`${it.emoji} ${it.label}`:id;
}
function analyze(kind,st){
  const D=DICT[kind]; const cats=Object.keys(D); const tags=st.tags||[];
  const score={}; cats.forEach(c=>score[c]={});
  const notes=[], customs=[];
  tags.forEach(tag=>{
    const toks=tokenize(tag), hits=[];
    cats.forEach(c=>{
      Object.keys(D[c]).forEach(id=>{
        if(toks.some(tk=>D[c][id].some(w=>mw(tk,w)))){ score[c][id]=(score[c][id]||0)+1; hits.push({c,id,d:describe(kind,c,id)}); }
      });
    });
    notes.push({kw:tag,hits});
    if(!hits.length) customs.push({kw:tag,val:35+hash(norm(tag))%64});
  });
  const out={kind,notes,customs,acc:{}};
  cats.forEach(c=>{
    if(c==='acc'){ Object.keys(D.acc).forEach(id=>{ if(score.acc[id]>0) out.acc[id]=true; }); return; }
    const ids=Object.keys(D[c]); const pre=st[c];
    const order=[pre].concat(ids.filter(i=>i!==pre));
    let best=order[0], bv=-1;
    order.forEach(id=>{ const v=(id===pre?2:0)+3*(score[c][id]||0); if(v>bv){ bv=v; best=id; } });
    out[c]=best;
  });
  return out;
}

/* ================= form ================= */
function chips(group,key,items,cur){
  return items.map(it=>`<label class="chip"><input type="radio" name="${group}-${key}" value="${it.id}" ${it.id===cur?'checked':''}><span>${it.emoji} ${esc(it.label)}</span></label>`).join('');
}
function q(label,inner,id){ return `<div role="group" aria-labelledby="${id}"><div class="qlabel" id="${id}">${label}</div><div class="chips">${inner}</div></div>`; }
function kwBlock(kind,sugg){
  return `<div class="kw"><label class="qlabel" for="${kind}Kw" style="display:block">✍️ নিজের ফিচার লেখো (যত খুশি)</label>
    <div class="kwrow"><input type="text" id="${kind}Kw" maxlength="${MAX_TAG_LEN}" placeholder="যেমন: ${esc(sugg[0])}, ${esc(sugg[1])}" autocomplete="off" enterkeyhint="done"><button type="button" class="kwadd" data-kind="${kind}">যোগ</button></div>
    <div class="tags" id="${kind}Tags"></div>
    <div class="sgs"><small>ট্যাপ করে দেখো:</small>${sugg.slice(0,6).map(s=>`<button type="button" class="sg" data-kind="${kind}" data-kw="${esc(s)}">${esc(s)}</button>`).join('')}</div>
    <p class="hint" id="${kind}Hint"></p></div>`;
}
function buildForms(){

    `<div class="field"><label class="qlabel" for="empName" style="display:block">কর্মচারীর নাম</label><input type="text" id="empName" maxlength="24" value="${esc(emp.name)}" placeholder="যেমন: ${DEF_EMP}" autocomplete="off"></div>`
    + q('কেমন কর্মচারী?',chips('emp','mood',EMP_MOODS,emp.mood),'q-e1')

    + q('সবচেয়ে প্রিয় খাবার বা পানীয়?',chips('emp','food',FOODS,emp.food),'q-e3')
    + q('দেরি করলে প্রথম বাহানা?',chips('emp','excuse',EXCUSES,emp.excuse),'q-e4')
    + kwBlock('emp',EMP_SUGG);
  $('#bossForm').innerHTML =

    + kwBlock('boss',BOSS_SUGG);
  tagsUI('emp'); tagsUI('boss');
}

/* ---- keyword tags ---- */
const stOf=k=>k==='emp'?emp:boss;
function tagsUI(kind){
  const st=stOf(kind), a=analyze(kind,st);

function computeResult(){

  const rnd=rng(hash(seed));
  const jit=v=>Math.max(3,Math.min(100,Math.round(v+(rnd()*16-8))));
  const ei=EMP_INFO[eE.mood], bi=BOSS_INFO[eB.type];
  const food=byId(FOODS,eE.food), exc=byId(EXCUSES,eE.excuse), line=byId(BOSS_LINES,eB.line);

  const bStats=bi.stats.map((v,i)=>({l:BOSS_STAT_LABELS[i],v:jit(v)}));

  eB.customs.slice(0,3).forEach(c=>bStats.push({l:'✨ '+c.kw,v:c.val,cu:true}));

const b64u={
  enc:s=>btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''),
  dec:s=>decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/'))))
};
function encodeState(){
  const o={v:1,
    e:{n:opts.showEmp?emp.name:'',m:emp.mood,l:emp.look,f:emp.food,x:emp.excuse,t:emp.tags},
    b:{n:opts.showBoss?boss.name:'',t:boss.type,l:boss.look,s:boss.line,k:boss.tags},
    o:[opts.showBoss?1:0,opts.showEmp?1:0]};
  return b64u.enc(JSON.stringify(o));
}
function decodeState(code){
  try{
    const o=JSON.parse(b64u.dec(code));
    const ok=(list,id,def)=>list.some(x=>x.id===id)?id:def;
    const tg=a=>Array.isArray(a)?a.filter(x=>typeof x==='string').map(x=>x.replace(/\s+/g,' ').trim().slice(0,MAX_TAG_LEN)).filter(Boolean).slice(0,MAX_TAGS):[];
    const nmv=s=>typeof s==='string'?s.slice(0,24):'';
    emp.name=nmv(o.e.n); emp.mood=ok(EMP_MOODS,o.e.m,'chai'); emp.look=ok(EMP_LOOKS,o.e.l,'spiky'); emp.food=ok(FOODS,o.e.f,'chai'); emp.excuse=ok(EXCUSES,o.e.x,'net'); emp.tags=tg(o.e.t);

}

const EXPORT_CSS='.steam{opacity:.95}.puff{opacity:.9}.zz{opacity:1}.hf{opacity:1}.ting{opacity:1}.glow{opacity:.35}';
function svgToImg(svg,w,h){
  const s=svg.replace('<svg ',`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" `).replace('<g class="all">',`<style>${EXPORT_CSS}</style><g class="all">`);
  return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s); });
}
function rr(x,px,py,w,h,r){
  x.beginPath(); x.moveTo(px+r,py); x.arcTo(px+w,py,px+w,py+h,r); x.arcTo(px+w,py+h,px,py+h,r); x.arcTo(px,py+h,px,py,r); x.arcTo(px,py,px+w,py,r); x.closePath();
}
function wrapLines(x,text,maxW){
  const words=String(text).split(/\s+/), lines=[]; let cur='';
  for(const w of words){ const t=cur?cur+' '+w:w; if(x.measureText(t).width>maxW&&cur){ lines.push(cur); cur=w; } else cur=t; }
  if(cur) lines.push(cur); return lines;
}
function fitBlock(x,text,maxW,maxLines,size,min,weight,fam){
  let s=size;
  for(;;){ x.font=`${weight} ${s}px ${fam}`; const L=wrapLines(x,text,maxW); if(L.length<=maxLines||s<=min) return {lines:L.slice(0,maxLines),size:s}; s-=2; }
}
function fitOne(x,text,maxW,size,min,weight,fam){
  let s=size; x.font=`${weight} ${s}px ${fam}`;
  while(x.measureText(text).width>maxW&&s>min){ s-=2; x.font=`${weight} ${s}px ${fam}`; }
}

    const dl=await dlPromise;
    if(dl){
      try{ await dl.save({filename:fname,data:blob}); toast('সেভ হয়েছে! এবার পোস্ট করে দাও 🎉'); return; }
      catch(err){ if(err&&err.code==='declined') return; }
    }
    try{ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fname; document.body.appendChild(a); a.click(); a.remove(); }catch(e){}
    toast('ডাউনলোড না হলে ওপরের ছবিটা চেপে ধরে সেভ করো');
  } finally { btn.disabled=false; }
}
async function sharePNG(){
  try{
    const blob=await pngBlob(); const f=new File([blob],'chakrir-circus.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:'চাকরির সার্কাস'}); }
    else toast('এই ডিভাইসে শেয়ার চলছে না, ডাউনলোড করো');
  }catch(e){ if(e&&e.name!=='AbortError') toast('শেয়ার করা গেল না, ডাউনলোড করো'); }
}
async function copyLink(){
  const txt=location.href;
  try{ await navigator.clipboard.writeText(txt); toast('লিংক কপি হয়েছে! বন্ধুকে পাঠাও 😄'); }
  catch(e){
    try{ const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); const ok=document.execCommand('copy'); document.body.removeChild(ta); toast(ok?'লিংক কপি হয়েছে! 😄':'কপি করা গেল না'); }
    catch(_){ toast('কপি করা গেল না'); }
  }
}
function syncHash(){ try{ history.replaceState(null,'','#p='+encodeState()); }catch(e){} }

/* ================= navigation (real page load) ================= */
let navigating=false;
function hardGo(hash){
  navigating=true;
  try{
    if(hash) location.hash=hash; else history.pushState(null,'',location.pathname+location.search);
    location.reload();
  }catch(e){ navigating=false; }
}
const GO_LABEL='🎬 প্রোফাইল রেডি করো!';
async function generate(){
  const btn=$('#goBtn'); if(btn.disabled) return;
  flushPending();
  btn.disabled=true;
  const msgs=['☕ চায়ের কাপ ধোয়া হচ্ছে...','👔 বসের টাই ইস্ত্রি হচ্ছে...','🔍 ফিচারগুলো বিশ্লেষণ হচ্ছে...','🎨 কার্টুন আঁকা শেষ হচ্ছে...'];
  let i=0; btn.textContent=msgs[0];
  const iv=setInterval(()=>{ i=(i+1)%msgs.length; btn.textContent=msgs[i]; },420);
  await new Promise(r=>setTimeout(r,RM?200:1600));
  clearInterval(iv);
  hardGo('#p='+encodeState());
  setTimeout(()=>{ // fallback if this view cannot reload
    if(!$('#viewBuild').hidden){ showResult(); }
  },900);
}
function showResult(){
  $('#viewBuild').hidden=true; $('#viewResult').hidden=false;
  renderResultPage(); schedulePoster();
  window.scrollTo(0,0);
}
function randomize(){
  const pick=a=>a[Math.floor(Math.random()*a.length)].id;
  emp.mood=pick(EMP_MOODS); emp.look=pick(EMP_LOOKS); emp.food=pick(FOODS); emp.excuse=pick(EXCUSES);
  boss.type=pick(BOSS_TYPES); boss.look=pick(BOSS_LOOKS); boss.line=pick(BOSS_LINES);
  emp.tags=[]; boss.tags=[];
  buildForms(); renderStage();
}

/* ================= wiring ================= */
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.matches('#viewBuild input[type=radio]')){
    const [g,k]=t.name.split('-');
    if(g==='emp'){ emp[k]=t.value; renderStage('emp'); }
    else { boss[k]=t.value; renderStage('boss'); }
    tagsUI(g);
  }
  if(t.id==='optBoss'){ opts.showBoss=t.checked; $('#cardBN').textContent=dispB(); updateMatchLabel(); syncHash(); schedulePoster(); }
  if(t.id==='optEmp'){ opts.showEmp=t.checked; $('#cardEN').textContent=dispE(); updateMatchLabel(); syncHash(); schedulePoster(); }
});
document.addEventListener('input',e=>{
  if(e.target.id==='empName'){ emp.name=e.target.value; updateTags(); }
  if(e.target.id==='bossName'){ boss.name=e.target.value; updateTags(); }
});
document.addEventListener('keydown',e=>{
  const id=e.target.id;
  if((id==='empKw'||id==='bossKw')&&(e.key==='Enter'||e.key===','||e.key==='،')){
    e.preventDefault(); const kind=id==='empKw'?'emp':'boss';
    if(addTag(kind,e.target.value)) e.target.value='';
  }
});
document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.classList.contains('kwadd')){ const kind=b.dataset.kind, el=$('#'+kind+'Kw'); if(addTag(kind,el.value)) el.value=''; el.focus(); return; }
  if(b.classList.contains('sg')){ addTag(b.dataset.kind,b.dataset.kw); return; }
  if(b.classList.contains('tagx')){ const kind=b.dataset.kind; stOf(kind).tags.splice(+b.dataset.i,1); tagsUI(kind); renderStage(kind); return; }
  switch(b.id){
    case 'goBtn': generate(); break;
    case 'randBtn': randomize(); break;
    case 'dlBtn': downloadPNG(); break;
    case 'shareBtn': sharePNG(); break;
    case 'linkBtn': copyLink(); break;
    case 'editBtn': hardGo('#e='+encodeState()); break;
    case 'newBtn': hardGo(''); break;
  }
});
window.addEventListener('hashchange',()=>{ if(!navigating) location.reload(); });

/* ================= boot ================= */
(function boot(){
  const m=/^#(p|e)=([A-Za-z0-9_-]+)$/.exec(location.hash);
  const ok=m && decodeState(m[2]);
  buildForms();
  if(ok && m[1]==='p'){
    showResult();
    if(navigator.canShare && typeof File!=='undefined'){ try{ if(navigator.canShare({files:[new File([''],'a.png',{type:'image/png'})]})) $('#shareBtn').hidden=false; }catch(e){} }
  } else {
    renderStage();
  }
})();
})();
</script>
